schema_version: 2
project: PLANARIA
version: "2.4.0"
author: "Alexander Stephen Donahue"
orcid: "0009-0006-8168-9648"
affiliation: "Independent Researcher (0thernes project), Spokane, WA, USA"
toolchain: "leanprover/lean4:v4.35.0"
mathlib_dependency: false
module_system: true
auto_implicit: false
relaxed_auto_implicit: false
lean_root: "lean"
spec_module: "lean/PlanariaProofs/Spec.lean"
challenge_module: "lean/Challenge.lean"
solution_module: "lean/Solution.lean"
comparator_config: "lean/comparator.json"
audit_entrypoint: "lean/VerifyAxioms.lean"
audit_transcript: "results/lean4-audit.txt"
multi_kernel_transcript: "results/lean4-multi-kernel.txt"
blueprint_url: "blueprint/index.html"
blueprint_data: "blueprint/blueprint.json"
differential_oracle: "reference/planaria_oracle.py"
negative_comparator_ci_verified: true
permitted_axioms:
  - propext
  - Quot.sound
  - Classical.choice
forbidden_axioms:
  - sorryAx
  - Lean.ofReduceBool
  - Lean.trustCompiler
  - _native
kernels:
  - name: "Lean 4.35.0 reference kernel"
    command: "lake build && lake env leanchecker --fresh Solution"
  - name: "leanchecker-paranoid"
    command: "lake env leanchecker-paranoid --fresh Solution"
  - name: "lean4lean"
    command: "lake check --paranoid"
  - name: "nanoda_bin (Rust)"
    command: "lake check --paranoid"
  - name: "con-leche (--verified)"
    command: "lake check --paranoid"
  - name: "con-ron (--verified)"
    command: "lake check --paranoid"
comparator_command_ci: "cd lean && lake comparator --config comparator.json --paranoid"
comparator_command_local_windows: "cd lean && lake comparator --config comparator.json --paranoid --inadvisably-no-sandbox"
theorem_count: 85
non_vacuity_witness_count: 10
adversarial_refutation_count: 8
modules:
  - name: "PlanariaProofs.GF256"
    theorems: 16
    scope: "GF(2^8) mod 0x11D field laws (gf256Field), universal 2x2 Cauchy non-singularity and exact decode (k = 2 only; k > 2 is tested, not proved) + non-vacuity witness"
  - name: "PlanariaProofs.MitosisBounds"
    theorems: 14
    scope: "Placement counting for zero-overlap mitosis (each half holds n_b/2 >= k+2 cells per bundle; sufficiency/impossibility arithmetic), PLACEMENT_SCHEDULE Nodup + sorted halves, 512B cell budget literals + witnesses; decoding of the halves is tested, not proved"
  - name: "PlanariaProofs.StratumAnastomosis"
    theorems: 8
    scope: "4-stratum viability lattice (matches hbin.js Step 4 by inspection and tests), 6-organ anastomosis zero-crash in the model, super-additive fusion, single-profile definitional separation vs RS(40,16) & RS(192,48) + witness"
  - name: "PlanariaProofs.ByzantineImmune"
    theorems: 18
    scope: "Byte-list Hamming triangle, RS(254,238) radius t=8 as Singleton arithmetic (no RS code or decoder formalized), even/odd burst-to-lane counting bounds (16B/17B/18B), dual-path Merkle commitment for an abstract injective hash, quarantine filter under the HashBinding hypothesis, arbitrary-position & arbitrary-list unpinned quorum + witnesses"
  - name: "PlanariaProofs.XenograftABI"
    theorems: 9
    scope: "BitVec 32 RAM sandboxing, bounded fuel termination, B0/B6 host sovereignty, dead-host stem-viability refusal, xenograft ABI safety + witnesses"
  - name: "PlanariaProofs.QuantumTemporal"
    theorems: 12
    scope: "4-qubit 16-amplitude integer norm preservation for X/Y/Z/CNOT/CZ/SWAP (scaled H doubles the norm), 360-frame list-based rewind exactness, literal arithmetic product 6,421,059,993,600 (reachability not modelled)"
  - name: "PlanariaProofs.AdversarialTests"
    theorems: 8
    scope: "Formal kernel-checked refutations (¬ P) of 8 deliberately weakened false variants across all six theorem families"
statement_fidelity_audit: "docs/reviews/2026-11-25-10-pass-red-team-audit.md"
submission_readiness_dossier: "docs/SUBMISSION_READINESS.md"
