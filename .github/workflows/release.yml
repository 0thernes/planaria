name: PLANARIA Release (Artifacts, SHA256SUMS & SLSA Provenance)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Verify & Publish Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deterministic build, 30 suites, 12 mutants, fuzz, Python oracle & hygiene gates
        run: |
          npm run build
          npm test
          npm run mutate
          npm run fuzz
          python reference/planaria_oracle.py
          npm run lint
          npm run check:citations
          npm run check:axioms
          npm run check:blueprint
      - name: Generate SHA256SUMS for release assets
        run: |
          sha256sum \
            dist/Donahue_2026_planaria.pdf \
            dist/arxiv_submission.tar.gz \
            artifacts/quantum_chronicle.hbin \
            artifacts/aegis_drift.hbin \
            artifacts/synth_reactor.hbin \
            artifacts/cipher_vault.hbin \
            artifacts/manifest.json \
            results/benchmarks.json \
            results/bench-history.csv \
            results/citation-audit.json \
            results/lean4-audit.txt \
            results/lean4-multi-kernel.txt \
            results/attestation.json > SHA256SUMS
          cat SHA256SUMS
      - name: Attest SLSA build provenance for release artifacts
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: |
            dist/Donahue_2026_planaria.pdf
            dist/arxiv_submission.tar.gz
            artifacts/*.hbin
            results/lean4-audit.txt
            results/lean4-multi-kernel.txt
            SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "PLANARIA ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/Donahue_2026_planaria.pdf \
            dist/arxiv_submission.tar.gz \
            artifacts/quantum_chronicle.hbin \
            artifacts/aegis_drift.hbin \
            artifacts/synth_reactor.hbin \
            artifacts/cipher_vault.hbin \
            artifacts/manifest.json \
            results/benchmarks.json \
            results/bench-history.csv \
            results/citation-audit.json \
            results/lean4-audit.txt \
            results/lean4-multi-kernel.txt \
            results/attestation.json \
            SHA256SUMS
