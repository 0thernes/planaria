name: PLANARIA CI & Formal Verification

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify-runtime:
    name: Build 4 .hbin Artifacts, 24-Suite Falsification & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Compile all 4 .plang living species -> .hbin artifacts
        run: npm run build
      - name: Run 24-suite falsifiable verification, security & quantum-temporal harness
        run: npm test
      - name: Verify CLI unaligned bisect -> fuse -> heal bit-exact SHA-256 & Xenograft roundtrip
        run: |
          node bin/planaria.mjs --version
          node bin/planaria.mjs inspect artifacts/quantum_chronicle.hbin
          node bin/planaria.mjs inspect artifacts/aegis_drift.hbin
          node bin/planaria.mjs bisect artifacts/aegis_drift.hbin /tmp/l.hbin /tmp/r.hbin --offset 49177
          node bin/planaria.mjs fuse /tmp/l.hbin /tmp/r.hbin -o /tmp/fused.hbin --gap 53
          node bin/planaria.mjs heal /tmp/r.hbin -o /tmp/healed.hbin
          cmp artifacts/aegis_drift.hbin /tmp/healed.hbin
          node bin/planaria.mjs xenograft artifacts/aegis_drift.hbin artifacts/synth_reactor.hbin -o /tmp/chimera.hbin
          node bin/planaria.mjs run /tmp/chimera.hbin --frames 30
      - name: Run Monte Carlo survival curve & Ed25519 attestation benchmark
        run: npm run benchmark

  verify-lean4:
    name: Pure Lean 4 v4.35.0 Kernel Proof Audit (62 Theorems — Strict Allowlist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan & Lean 4 v4.35.0 toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Clean-build all 62 Lean 4 theorems and enforce strict axiom allowlist
        working-directory: lean
        run: |
          lake clean
          lake build 2>&1 | tee /tmp/lean-ci.log
          python3 - <<'PY'
          import re, sys
          ALLOWED = {"propext", "Classical.choice", "Quot.sound"}
          with open("/tmp/lean-ci.log", "r", encoding="utf-8") as f:
              text = f.read()
          if "sorryAx" in text or "ofReduceBool" in text or "trustCompiler" in text:
              print("ERROR: Forbidden axiom (sorryAx / ofReduceBool / trustCompiler) detected!")
              sys.exit(1)
          audited = 0
          for line in text.splitlines():
              m_none = re.search(r"'(Planaria\.[^']+)' does not depend on any axioms", line)
              m_deps = re.search(r"'(Planaria\.[^']+)' depends on axioms: \[([^\]]*)\]", line)
              if m_none:
                  audited += 1
              elif m_deps:
                  audited += 1
                  axioms = {a.strip() for a in m_deps.group(2).split(",") if a.strip()}
                  bad = axioms - ALLOWED
                  if bad:
                      print(f"ERROR: Disallowed axioms {bad} in {m_deps.group(1)}")
                      sys.exit(1)
          print(f"STRICT AXIOM ALLOWLIST PASSED: {audited} Planaria theorems audited (all strictly within {sorted(ALLOWED)}).")
          if audited < 62:
              print(f"ERROR: Expected >= 62 audited theorems, found {audited}")
              sys.exit(1)
          PY

  verify-paper:
    name: AMS-LaTeX White Paper & arXiv Bundle Build (Tectonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tectonic TeX engine
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: Compile paper/main.tex and verify dist/arxiv_submission.tar.gz standalone
        run: |
          mkdir -p /tmp/pdf-out /tmp/arxiv-check/out
          tectonic -X compile paper/main.tex --outdir /tmp/pdf-out --keep-logs
          test -s /tmp/pdf-out/main.pdf
          tar -xzf dist/arxiv_submission.tar.gz -C /tmp/arxiv-check
          tectonic -X compile /tmp/arxiv-check/main.tex --outdir /tmp/arxiv-check/out
          test -s /tmp/arxiv-check/out/main.pdf
