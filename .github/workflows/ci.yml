name: PLANARIA CI (Cross-Platform Tests, 6-Kernel Lean 4.35, Oracle, Paper & Security)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  node-matrix:
    name: Build, 30 Suites, 12 Mutants, Fuzz & Python Oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Deterministic artifact build
        run: npm run build
      - name: 30-suite verification, AudioWorklet DSP, property-based & metamorphic harness
        run: npm test
      - name: 12-mutant surgical mutation testing (100% kill target)
        run: npm run mutate
      - name: 2,000-case deterministic adversarial fuzzer
        run: npm run fuzz
      - name: Clean-room Python 3 differential oracle (768 cells, 4 species, mitosis, Bell/GHZ)
        run: python reference/planaria_oracle.py
      - name: Static analysis, theorem-drift, citations, axiom allowlist & Proof Blueprint 1:1
        run: npm run lint && npm run check:citations && npm run check:axioms && npm run check:blueprint
      - name: Build static GitHub Pages bundle (Studio + Proof Blueprint)
        run: npm run pages
      - name: Run 4-architecture statistical benchmarks (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: npm run benchmark
      - name: Upload benchmark JSON artifact (report-only tracking)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: planaria-benchmarks-json
          path: results/benchmarks.json

  lean-6kernel:
    name: Pure Lean 4.35.0 — 85 Theorems, 6-Kernel Palomar & Negative Tamper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bubblewrap for Palomar multi-kernel sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install elan & pinned Lean 4.35.0 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build PlanariaProofs, Solution & Challenge + strict 85-theorem axiom allowlist
        working-directory: lean
        run: |
          lake build
          lake build Challenge
          lake env lean VerifyAxioms.lean > /tmp/lean4-audit.txt
          cat /tmp/lean4-audit.txt
          python3 - <<'PY'
          import json, re, sys
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          raw = open("/tmp/lean4-audit.txt", encoding="utf-8").read()
          if re.search(r"sorryAx|ofReduceBool|trustCompiler|_native", raw):
              sys.exit("FORBIDDEN AXIOM TOKEN DETECTED")
          comp = json.load(open("comparator.json", encoding="utf-8"))
          seen = {}
          for line in raw.splitlines():
              m = re.match(r"^'([^']+)'\s+depends on axioms:\s+\[([^\]]*)\]", line)
              if m:
                  axs = [a.strip() for a in m.group(2).split(",") if a.strip()]
                  bad = [a for a in axs if a not in allowed]
                  if bad:
                      sys.exit(f"DISALLOWED AXIOM(S) on {m.group(1)}: {bad}")
                  seen[m.group(1)] = axs
              else:
                  m0 = re.match(r"^'([^']+)'\s+does not depend on any axioms", line)
                  if m0:
                      seen[m0.group(1)] = []
          missing = [t for t in comp["theorem_names"] if t not in seen]
          if len(seen) != 85 or missing:
              sys.exit(f"THEOREM COUNT/COVERAGE MISMATCH: seen={len(seen)} missing={missing}")
          print(f"STRICT AXIOM ALLOWLIST PASS: {len(seen)}/85 theorems verified strictly within {sorted(allowed)}")
          PY
      - name: Run independent paranoid & multi-kernel checks (lake check + comparator)
        working-directory: lean
        run: |
          lake env leanchecker --fresh Solution
          lake env leanchecker-paranoid --fresh Solution
          lake check --paranoid
          lake comparator --config comparator.json --paranoid
      - name: Live negative tamper test (mutated Challenge.lean MUST be rejected by comparator)
        working-directory: lean
        run: |
          rm -rf /tmp/neg-comparator
          cp -a . /tmp/neg-comparator
          sed -i 's/192 \* 512 = 98304/192 * 512 = 98305/' /tmp/neg-comparator/Challenge.lean
          grep -q '192 \* 512 = 98305' /tmp/neg-comparator/Challenge.lean
          (
            cd /tmp/neg-comparator
            lake build Challenge
            if lake comparator --config comparator.json --paranoid; then
              echo "FATAL: lake comparator --paranoid ACCEPTED tampered Challenge.lean!" >&2
              exit 1
            else
              echo "PASS: live negative tamper test rejected mutated Challenge.lean as expected."
            fi
          )

  paper-pdf:
    name: AMS-LaTeX White Paper & Standalone arXiv Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
      - name: Compile paper/main.tex
        run: |
          mkdir -p /tmp/paper-out
          tectonic -X compile paper/main.tex --outdir /tmp/paper-out
          ls -lh /tmp/paper-out/main.pdf
      - name: Verify standalone dist/arxiv_submission.tar.gz compiles cleanly
        run: |
          mkdir -p /tmp/arxiv-test
          tar -xzf dist/arxiv_submission.tar.gz -C /tmp/arxiv-test
          tectonic -X compile /tmp/arxiv-test/main.tex --outdir /tmp/arxiv-test
          ls -lh /tmp/arxiv-test/main.pdf
      - name: Generate CI SHA256SUMS and SLSA provenance attestation
        run: |
          sha256sum artifacts/*.hbin dist/Donahue_2026_planaria.pdf dist/arxiv_submission.tar.gz results/lean4-audit.txt results/lean4-multi-kernel.txt > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: |
            artifacts/*.hbin
            dist/Donahue_2026_planaria.pdf
            dist/arxiv_submission.tar.gz
            results/lean4-audit.txt
            results/lean4-multi-kernel.txt
            SHA256SUMS

  audit-and-security:
    name: Build Standard v1.2.0 Audit & Report-Only Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Build Standard v1.2.0 self-audit (report-only)
        continue-on-error: true
        run: bash scripts/audit-repo.sh .
      - name: Secret scan via gitleaks (report-only)
        continue-on-error: true
        run: |
          GITLEAKS_VER="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact
      - name: Dependency vulnerability scan via osv-scanner (report-only)
        continue-on-error: true
        run: |
          OSV_VER="1.9.1"
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VER}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --lockfile=package-lock.json || { code=$?; if [ "$code" -eq 128 ]; then echo "osv-scanner: 0 external dependencies in package-lock.json (PASS)"; else exit "$code"; fi; }
